name: Deploy (manual)

# Manual-only deploy. This Firebase project (philipamwata-personal) is shared
# with other apps, so:
#   * This workflow NEVER deploys firestore/storage RULES or INDEXES — those are
#     shared across repos and must be diffed against the live Console and
#     deployed by a human (see firestore.rules / firestore.indexes.json headers).
#   * It only ever touches THIS app's slice: hosting target `eu-workme` and the
#     Cloud Functions codebase `jobslu`.
#
# Requires a repo secret FIREBASE_TOKEN (generate with `firebase login:ci`).
# CI (ci.yml) must be green first; this just builds and ships.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: hosting
        options:
          - hosting
          - functions
          - hosting-and-functions

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PROJECT: philipamwata-personal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Guard — FIREBASE_TOKEN present
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Generate one with 'firebase login:ci' and add it to repo secrets."
            exit 1
          fi

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install web deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Build web app
        if: ${{ inputs.target != 'functions' }}
        run: npx ng build --configuration production

      - name: Build functions
        if: ${{ inputs.target != 'hosting' }}
        run: npm --prefix functions run build

      - name: Deploy hosting (eu-workme)
        if: ${{ inputs.target != 'functions' }}
        run: firebase deploy --only hosting:eu-workme --project "$PROJECT" --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy functions (jobslu codebase)
        if: ${{ inputs.target != 'hosting' }}
        run: firebase deploy --only functions:jobslu --project "$PROJECT" --token "$FIREBASE_TOKEN" --non-interactive
