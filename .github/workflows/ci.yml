name: CI

# Build the web app and Cloud Functions, and run the functions test suite, on
# every push to main and every PR. Build-and-test only — deploying is manual
# (see deploy.yml) because this Firebase project is shared with other apps and
# nothing here is allowed to deploy automatically (see README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  functions:
    name: Functions — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      # node's glob handling differs across shells, so discover test files
      # explicitly rather than relying on `lib/**/*.test.js` expansion.
      - name: Run tests
        run: node --test $(find lib -name '*.test.js')

  web:
    name: Web app — production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
